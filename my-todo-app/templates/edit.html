{% extends "base.html" %}

{% block content %}
<h1>Todoを編集</h1>

<form action="{{ url_for('edit', todo_id=todo.id) }}" method="post">
  <input type="text" name="title" value="{{ todo.title }}" required>
  <button type="submit">更新</button>
</form>

<a href="{{ url_for('index') }}">一覧に戻る</a>
{% endblock %}
