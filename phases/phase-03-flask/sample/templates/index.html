{% extends "base.html" %}

{% block content %}
<h1>Todo一覧</h1>

<form action="{{ url_for('create') }}" method="post" class="add-form">
  <input type="text" name="title" placeholder="やることを入力" required>
  <button type="submit">追加</button>
</form>

{% if todos %}
<ul class="todo-list">
  {% for todo in todos %}
  <li class="todo-item">
    <span class="title">{{ todo.title }}</span>
    <a href="{{ url_for('edit', todo_id=todo.id) }}">編集</a>
    <form action="{{ url_for('delete', todo_id=todo.id) }}" method="post" class="inline">
      <button type="submit" class="danger">削除</button>
    </form>
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="empty">Todoはまだありません。</p>
{% endif %}
{% endblock %}
