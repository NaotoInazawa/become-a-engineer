# nginx の設定ファイル
# 配置先: /etc/nginx/sites-available/todo
#
# 80番ポートで受け取ったリクエストを、
# 同じサーバー内の gunicorn(127.0.0.1:8000)へ転送する(リバースプロキシ)

server {
    listen 80;
    # 独自ドメインを使う場合は「_」をドメイン名に書き換える(例: todo.example.com)
    server_name _;

    # アクセスログとエラーログの場所
    access_log /var/log/nginx/todo_access.log;
    error_log  /var/log/nginx/todo_error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;

        # 元のリクエストの情報を gunicorn(Flask)に伝える
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
