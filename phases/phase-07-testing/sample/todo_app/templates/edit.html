{% extends "base.html" %}

{% block title %}Todoの編集{% endblock %}

{% block content %}
<h1>Todoの編集</h1>

<form action="{{ url_for('todos.edit', todo_id=todo.id) }}" method="post" class="add-form">
  <input type="text" name="title" value="{{ todo.title }}" required>
  <button type="submit">保存</button>
</form>

<p><a href="{{ url_for('todos.index') }}">一覧に戻る</a></p>
{% endblock %}
