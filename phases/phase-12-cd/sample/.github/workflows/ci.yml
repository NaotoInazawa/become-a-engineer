# CI(継続的インテグレーション)のワークフロー
# プルリクエストのたびに、コードチェックとテストを自動で実行する。
# main へのマージ時は、deploy.yml から呼び出されて実行される(workflow_call)

name: CI

on:
  pull_request:
  workflow_call:

jobs:
  test:
    # GitHub が用意する Ubuntu の仮想マシン(ランナー)で実行する
    runs-on: ubuntu-latest

    # テスト用の PostgreSQL をサービスコンテナとして起動する
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: todo
          POSTGRES_PASSWORD: todo
          POSTGRES_DB: todo_test
        ports:
          - 5432:5432
        # DB が起動しきるまで待つ
        options: >-
          --health-cmd "pg_isready -U todo -d todo_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      # 1. リポジトリのコードを取得する
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Python をセットアップする(pip のキャッシュも有効にする)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      # 3. ライブラリをインストールする
      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # 4. コードの書き方をチェックする
      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      # 5. テストを実行する(PostgreSQL を使う)
      - name: Test (pytest)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://todo:todo@localhost:5432/todo_test
        run: pytest --cov=todo_app --cov-report=term-missing
