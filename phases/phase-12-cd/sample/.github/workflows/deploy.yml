# CD(継続的デプロイ)のワークフロー
# main にマージされたら、テスト → イメージのビルド → Lambda へのデプロイ → 動作確認 を自動で行う
#
# 事前に GitHub の Settings → Secrets and variables → Actions → Variables に以下を登録する
#   AWS_REGION     : ap-northeast-1
#   AWS_ACCOUNT_ID : AWSアカウントID
#   AWS_ROLE_ARN   : デプロイ用IAMロールのARN

name: Deploy

on:
  push:
    branches: [main]

# 同時に複数のデプロイが走らないようにする
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # 1. まず CI(ci.yml)を実行する
  test:
    uses: ./.github/workflows/ci.yml

  # 2. テストが成功したらデプロイする
  deploy:
    needs: test
    runs-on: ubuntu-latest
    # GitHub の Environments 機能(承認フローなどを設定できる)
    environment: production

    # OIDC で AWS に認証するため、IDトークンの発行を許可する
    permissions:
      contents: read
      id-token: write

    env:
      IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com/todo:${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # アクセスキーを使わず、GitHub が発行する一時的なトークンで AWS に認証する
      - name: Authenticate to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region "${{ vars.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com"

      # コミットハッシュをタグにすることで、どのコードがデプロイされたか追えるようにする
      - name: Build and push image
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Lambda
        run: |
          aws lambda update-function-code --function-name todo --image-uri "$IMAGE"
          aws lambda wait function-updated --function-name todo

      # デプロイ後に /health を確認する。失敗したらワークフローを失敗させる
      - name: Health check
        run: |
          URL=$(aws apigatewayv2 get-apis --query "Items[?Name=='todo-api'].ApiEndpoint" --output text)
          for i in 1 2 3 4 5; do
            if curl --fail --silent "$URL/health"; then
              echo ""
              echo "Health check passed: $URL"
              exit 0
            fi
            echo "Retry $i..."
            sleep 10
          done
          echo "Health check failed"
          exit 1
